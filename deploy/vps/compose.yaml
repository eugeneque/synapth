name: synapth

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapth}
      POSTGRES_USER: ${POSTGRES_USER:-synapth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${SYNAPTH_MIGRATOR_IMAGE:?SYNAPTH_MIGRATOR_IMAGE is required}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapth}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-synapth}?schema=public
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  app:
    image: ${SYNAPTH_IMAGE:?SYNAPTH_IMAGE is required}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapth}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-synapth}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: https://${SYNAPTH_DOMAIN:-synapth.localhost8081.ru}
      NEXT_PUBLIC_APP_URL: https://${SYNAPTH_DOMAIN:-synapth.localhost8081.ru}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Synapth <noreply@synapth.localhost8081.ru>}
      SYNAPTH_EMAIL_VERIFICATION: ${SYNAPTH_EMAIL_VERIFICATION:-0}
      SYNAPTH_PLATFORM_FEE_PERCENT: ${SYNAPTH_PLATFORM_FEE_PERCENT:-15}
      SYNAPTH_CRON_SECRET: ${SYNAPTH_CRON_SECRET:?SYNAPTH_CRON_SECRET is required}
      SYNAPTH_AUTO_CRAWL: ${SYNAPTH_AUTO_CRAWL:-1}
      # V8 heap cap well below the container limit: Prisma buffers and JSON strings live outside the heap (~1.5 GB at peak).
      NODE_OPTIONS: --max-old-space-size=${SYNAPTH_HEAP_MB:-2560}
    # A runaway app restarts this container instead of starving Postgres, sshd and journald.
    mem_limit: ${SYNAPTH_MEMORY_LIMIT:-5g}
    expose:
      - "3000"
    volumes:
      - crawl_data:/app/data
    networks:
      - backend
      - traefik-public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.synapth.rule: Host(`${SYNAPTH_DOMAIN:-synapth.localhost8081.ru}`)
      traefik.http.routers.synapth.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.synapth.tls: "true"
      traefik.http.routers.synapth.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-cloudflare}
      traefik.http.services.synapth.loadbalancer.server.port: "3000"

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_LISTEN_PORT: "5050"
    expose:
      - "5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend
      - traefik-public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:5050/misc/ping').status == 200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik-public}
      traefik.http.routers.synapth-pgadmin.rule: Host(`${PGADMIN_DOMAIN:-pga.localhost8081.ru}`)
      traefik.http.routers.synapth-pgadmin.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.synapth-pgadmin.tls: "true"
      traefik.http.routers.synapth-pgadmin.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-cloudflare}
      traefik.http.routers.synapth-pgadmin.middlewares: synapth-pgadmin-auth@docker
      traefik.http.middlewares.synapth-pgadmin-auth.basicauth.users: ${PGADMIN_BASIC_AUTH_USERS:?PGADMIN_BASIC_AUTH_USERS is required}
      traefik.http.middlewares.synapth-pgadmin-auth.basicauth.removeheader: "true"
      traefik.http.services.synapth-pgadmin.loadbalancer.server.port: "5050"

volumes:
  postgres_data:
  crawl_data:
  pgadmin_data:

networks:
  backend:
    internal: true
  traefik-public:
    name: ${TRAEFIK_NETWORK:-traefik-public}
    external: true
